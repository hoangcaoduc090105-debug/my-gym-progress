name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # E2E chạy trên bản build gốc "/" (vite preview); lỗi => dừng, KHÔNG deploy.
      - name: Build cho E2E
        run: npm run build
      - name: Cài Chromium cho Playwright
        run: npx playwright install --with-deps chromium
      - name: E2E
        run: npm run test:e2e
        env:
          SCREENSHOT_DIR: e2e-screenshots
      - name: Lưu ảnh chụp E2E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e-screenshots
          if-no-files-found: ignore
      - name: Build (đường dẫn con /<tên-repo>/)
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - run: npm run audit:network
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
